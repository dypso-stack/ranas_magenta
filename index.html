<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranas Magenta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">MINI GAME</p>
        <h1>Ranas Magenta</h1>
        <p class="subtitle">Sube rebotando de nenúfar en nenúfar y esquiva o salta a los cóndores.</p>
      </div>
      <div class="scores">
        <div class="score-box">
          <span>PUNTOS</span>
          <strong id="score">0</strong>
        </div>
        <div class="score-box">
          <span>RÉCORD</span>
          <strong id="best">0</strong>
        </div>
      </div>
    </header>

    <section class="game-card">
      <canvas id="game" width="900" height="520" aria-label="Juego de ranas magenta"></canvas>
      <div class="controls">
        <button id="startBtn">Jugar</button>
        <span>← → o A/D para moverte (la rana rebota sola) · Cóndores: esquívalos o pásalos por encima para bono · R reinicia</span>
      </div>
    </section>

    <p id="message" class="message">Pulsa <b>Jugar</b> para comenzar.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
