<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranas Magenta</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell">
    <header>
      <div>
        <p class="eyebrow">MINI GAME</p>
        <h1>Ranas Magenta</h1>
        <p class="subtitle">Salta sobre los nenúfares y consigue la mayor puntuación.</p>
      </div>
      <div class="score-box">
        <span>PUNTOS</span>
        <strong id="score">0</strong>
      </div>
    </header>

    <section class="game-card">
      <canvas id="game" width="900" height="520" aria-label="Juego de ranas magenta"></canvas>
      <div class="controls">
        <button id="startBtn">Jugar</button>
        <span>← → para moverte · ESPACIO para saltar · R para reiniciar</span>
      </div>
    </section>

    <p id="message" class="message">Pulsa <b>Jugar</b> para comenzar.</p>
  </main>
  <script src="game.js"></script>
</body>
</html>
